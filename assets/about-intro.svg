  <title id="ab-t">About Abhay Deep</title>
  <desc id="ab-d">Java backend engineer in Pune. B.Tech in Computer Science with Honours, CGPA 8.9. Software Engineer at Accenture since July 2024, building Spring Boot microservices for a UK banking client. Shipped MediShop and is building REKLO. Primary language Java; drawn to distributed systems, performance and AI-powered developer tools.</desc>
