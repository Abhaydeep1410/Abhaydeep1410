<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Certifications</title>
  <desc id="ce-d">AWS Certified Cloud Practitioner. Microsoft Azure Fundamentals (AZ-900) and Azure AI Fundamentals (AI-900). Google Cloud Digital Leader. Anthropic Claude Certified Developer / Associate.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1628"/><stop offset="1" stop-color="#050D1A"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#0D9488" stop-opacity=".5"/><stop offset="1" stop-color="#0E4A56" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4F8"/><stop offset=".5" stop-color="#8EEBDD"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ce-tile { animation: ce-in 1s cubic-bezier(.34,1.3,.64,1) both; }
    .ce-edge { stroke-dasharray: 870; stroke-dashoffset: 870; animation: ce-edge 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes ce-edge { 0% { stroke-dashoffset: 870; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 60%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-tile { animation: none; } .ce-edge { display: none; } }
  </style>
  <rect width="1200" height="250" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="250" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="19.5" fill="none" stroke="#2DD4BF" stroke-opacity=".16"/>
  <g class="ce-tile" style="animation-delay:0.20s"><g transform="translate(40 40)"><rect width="265" height="170" rx="14" fill="#0A1628" stroke="#2DD4BF" stroke-opacity=".24"/><rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.00s"/><text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#2DD4BF">AWS</text><circle cx="238" cy="31" r="3.5" fill="#2DD4BF"/><line x1="22" y1="54" x2="243" y2="54" stroke="#2DD4BF" stroke-opacity=".15"/><text class="ce-sans" x="22" y="86" font-size="14" fill="#EAF4F8">AWS Certified</text><text class="ce-sans" x="22" y="108" font-size="14" fill="#8EEBDD">Cloud Practitioner</text></g></g>
<g class="ce-tile" style="animation-delay:0.32s"><g transform="translate(325 40)"><rect width="265" height="170" rx="14" fill="#0A1628" stroke="#2DD4BF" stroke-opacity=".24"/><rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.35s"/><text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#2DD4BF">MICROSOFT</text><circle cx="238" cy="31" r="3.5" fill="#2DD4BF"/><circle cx="227" cy="31" r="3.5" fill="#2DD4BF"/><line x1="22" y1="54" x2="243" y2="54" stroke="#2DD4BF" stroke-opacity=".15"/><text class="ce-sans" x="22" y="86" font-size="14" fill="#EAF4F8">Azure Fundamentals</text><text class="ce-sans" x="22" y="108" font-size="14" fill="#8EEBDD">AZ-900</text><text class="ce-sans" x="22" y="130" font-size="14" fill="#EAF4F8">Azure AI Fundamentals</text><text class="ce-sans" x="22" y="152" font-size="14" fill="#8EEBDD">AI-900</text></g></g>
<g class="ce-tile" style="animation-delay:0.44s"><g transform="translate(610 40)"><rect width="265" height="170" rx="14" fill="#0A1628" stroke="#2DD4BF" stroke-opacity=".24"/><rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.70s"/><text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#2DD4BF">GOOGLE CLOUD</text><circle cx="238" cy="31" r="3.5" fill="#2DD4BF"/><line x1="22" y1="54" x2="243" y2="54" stroke="#2DD4BF" stroke-opacity=".15"/><text class="ce-sans" x="22" y="86" font-size="14" fill="#EAF4F8">Cloud Digital</text><text class="ce-sans" x="22" y="108" font-size="14" fill="#8EEBDD">Leader</text></g></g>
<g class="ce-tile" style="animation-delay:0.56s"><g transform="translate(895 40)"><rect width="265" height="170" rx="14" fill="#0A1628" stroke="#2DD4BF" stroke-opacity=".24"/><rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:3.05s"/><text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#2DD4BF">ANTHROPIC</text><circle cx="238" cy="31" r="3.5" fill="#2DD4BF"/><line x1="22" y1="54" x2="243" y2="54" stroke="#2DD4BF" stroke-opacity=".15"/><text class="ce-sans" x="22" y="86" font-size="14" fill="#EAF4F8">Claude Certified</text><text class="ce-sans" x="22" y="108" font-size="14" fill="#8EEBDD">Developer / Associate</text></g></g>
</svg>
